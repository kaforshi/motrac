<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Finku Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#10B981', dark: '#1E293B' }
                }
            }
        }
    </script>
</head>
<body class="h-screen bg-white font-sans text-slate-800">

    <div class="flex h-full w-full">
        
        <!-- Left Side: Branding / Visual (Blue Theme for Register) -->
        <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-blue-600 to-indigo-900 text-white flex-col justify-between p-12 relative overflow-hidden">
            <!-- Decorative Elements -->
            <div class="absolute bottom-0 right-0 -mr-20 -mb-20 w-96 h-96 rounded-full bg-white opacity-5 blur-3xl"></div>
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>

            <!-- Logo -->
            <div class="flex items-center gap-2 z-10">
                <div class="w-8 h-8 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center font-bold">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Finku</span>
            </div>

            <!-- Value Proposition -->
            <div class="z-10 max-w-lg">
                <h2 class="text-4xl font-bold mb-4 leading-tight">Mulai Perjalanan Finansial Anda.</h2>
                <ul class="space-y-4 text-blue-100 mt-6">
                    <li class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full bg-green-400/20 flex items-center justify-center text-green-400"><i class="fa-solid fa-check text-xs"></i></div>
                        <span>Tracking pengeluaran tanpa batas</span>
                    </li>
                    <li class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full bg-green-400/20 flex items-center justify-center text-green-400"><i class="fa-solid fa-check text-xs"></i></div>
                        <span>Analisa grafik keuangan</span>
                    </li>
                    <li class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full bg-green-400/20 flex items-center justify-center text-green-400"><i class="fa-solid fa-check text-xs"></i></div>
                        <span>Keamanan data terenkripsi</span>
                    </li>
                </ul>
            </div>

            <!-- Copyright -->
            <div class="text-xs text-blue-200/60 z-10">
                &copy; 2024 Finku Financial Technologies.
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white overflow-y-auto">
            <div class="w-full max-w-md space-y-6">
                
                <!-- Mobile Logo -->
                <div class="lg:hidden flex justify-center mb-4">
                    <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-xl">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                </div>

                <div class="text-center lg:text-left">
                    <h2 class="text-3xl font-bold text-dark">Buat Akun Baru</h2>
                    <p class="text-gray-500 mt-2">Gratis selamanya, tidak perlu kartu kredit.</p>
                </div>

                <form action="dashboard.html" class="space-y-4">
                    <!-- Name Input -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <input type="text" id="name" required placeholder="Budi Santoso" class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition text-sm">
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-regular fa-envelope"></i>
                            </div>
                            <input type="email" id="email" required placeholder="nama@email.com" class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition text-sm">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Buat Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" required placeholder="Minimal 8 karakter" class="pl-10 pr-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition text-sm">
                            <button type="button" onclick="togglePassword('password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="flex items-start gap-3">
                        <div class="flex items-center h-5">
                            <input id="terms" type="checkbox" required class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary/30 text-primary">
                        </div>
                        <label for="terms" class="text-sm text-gray-500">
                            Saya setuju dengan <a href="#" class="text-primary hover:underline">Syarat & Ketentuan</a> serta <a href="#" class="text-primary hover:underline">Kebijakan Privasi</a>.
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-dark hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg transform active:scale-95">
                        Daftar Akun
                    </button>
                </form>

                <!-- Footer -->
                <p class="text-center text-sm text-gray-600">
                    Sudah punya akun? 
                    <a href="login.html" class="font-bold text-primary hover:text-emerald-700 transition">Masuk di sini</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
